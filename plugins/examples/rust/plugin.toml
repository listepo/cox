# The shared example every guest language implements (PL§13): a status
# segment with the turn count, a hook that counts failed tool calls, the
# `/example:reset` command and a `turn_started` subscription.
api = 1
id = "example"
version = "0.1.0"
name = "Turn counter"
description = "Turns and failed tool calls in the status line; /example:reset clears both"
wasm = "example.wasm"

[capabilities]
events = ["turn_started"]
# A failed call fires `PostToolUseFailure`, a successful one `PostToolUse`;
# both are listed so the counter reads `tool_response.is_error` whichever
# the host sends.
hooks = ["PostToolUse", "PostToolUseFailure"]
kv = true

[capabilities.ui]
status = true
commands = true
