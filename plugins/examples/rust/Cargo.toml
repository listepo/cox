[package]
name = "cox-plugin-example"
description = "The PL§13 reference example: a turn-count status segment, a tool-failure hook and /example:reset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# rlib alongside cdylib so `just plugin-test` runs the pure counting logic on
# the host target; only the cdylib ships, as the package's `example.wasm`,
# built by `crates/cox-plugin-fixtures` (PL§13).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cox-plugin-sdk = { path = "../../sdk" }
serde_json = { workspace = true }
