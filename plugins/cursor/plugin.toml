api = 1
id = "cursor"
version = "0.1.0"
name = "Cursor"
description = "Drive Cursor's official `agent` CLI as an ACP or stream-json subagent (P35)"
wasm = "cursor.wasm"

# The host resolves, sandboxes and spawns `agent` itself (EA§2 in
# docs/design/external-agents.md); this plugin declares the entry only, no
# `[capabilities]`, `[[provider]]` or `[[mcp]]` section. `mode = "acp"` is
# this entry's protocol; `stream-json` (EA§5) is the manifest's documented
# alternative for a plugin that wants the line-oriented mapper instead.
[[external_agents]]
name = "cursor"
command = "agent"
mode = "acp"
key_env = "CURSOR_API_KEY"
