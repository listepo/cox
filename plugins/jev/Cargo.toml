[package]
name = "cox-plugin-jev"
description = "cox plugin: TypeSafe Jev System One decision model (T33.40)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# rlib alongside cdylib so `cargo test` can run the pure `wire` module on the
# host target; only the cdylib ships as the plugin's `jev.wasm` (PL§2).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cox-plugin-sdk = { path = "../sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
figment = { workspace = true }
