# release-plz (A17). Every crate inherits `[workspace.package].version`, so a
# release is one version, one tag `v<version>`, one CHANGELOG.md. release-plz
# opens the release PR (bumps the version, rewrites the changelog) and pushes
# the tag when it merges; the cargo-dist workflow (`release.yml`) builds the
# binaries and creates the GitHub Release from that tag, so release-plz never
# creates one itself.
[workspace]
# cox is a binary shipped by cargo-dist, not a crates.io crate: versions come
# from git tags, nothing is published, and cargo-semver-checks has no baseline.
git_only = true
publish = false
semver_check = false
git_tag_name = "v{{ version }}"
# One tag per release, made by the `cox` package (below). release-plz creates
# tags one package at a time through the forge API and only checks the local
# clone for an existing tag, so ten packages naming the same tag would fail on
# the second one. The other nine still resolve their last release from the
# shared `v*` pattern.
git_tag_enable = false
git_release_enable = false
# Release only when the release PR merges, never straight from a push to main.
release_always = false
dependencies_update = false
# Ten crates, one changelog: only the `cox` package writes it (below).
changelog_update = false

[[package]]
name = "cox"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "cox-protocol",
    "cox-core",
    "cox-provider",
    "cox-tools",
    "cox-mcp",
    "cox-store",
    "cox-ext",
    "cox-tui",
    "cox-acp",
]

# cox commits are `<task-id>: <title>`, not conventional commits, so there are
# no groups: every commit lands in the release's list verbatim, oldest first.
# `raw_message`, not `message`: git-cliff reads `T0.1: title` as a conventional
# `T0.1` type and `message` would drop the task id.
[changelog]
header = """
# Changelog

All notable changes to cox, generated by release-plz from the task commits
(`<task-id>: <title>`).

"""
body = """
## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits -%}
* {{ commit.raw_message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor -%}
"""
trim = true
sort_commits = "oldest"
