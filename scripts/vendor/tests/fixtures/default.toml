[core]
home = "~/.cox"

[providers.anthropic]
base_url = "https://api.anthropic.com"
models = [{id="claude-haiku-4-5", context_window=111111, efforts=["low"]}, {id="claude-sonnet-5", context_window=1000000, efforts=["low", "high"]}]   # id, context window, efforts per model (effort values from models.dev)

[providers.openai]
base_url = "https://api.openai.com/v1"
models = [{id="gpt-5.1", context_window=999999, efforts=["low"]}]   # id, context window, efforts per model (effort values from models.dev)

[providers.moonshot]
base_url = "https://api.moonshot.ai/v1"
models = [{id="kimi-k2.6", context_window=262144, efforts=["low", "high"]}, {id="kimi-k2.7-code", context_window=262144, efforts=["low", "high", "xhigh"]}]   # id, context window, efforts per model

[providers.z-ai]
base_url = "https://api.z.ai/api/paas/v4"
models = [{id="glm-5.2", context_window=1000000, efforts=["low", "high", "xhigh"]}]   # id, context window, efforts per model

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
models = [{id="qwen/qwen3-coder-plus", context_window=1000000, efforts=["low", "high", "xhigh"]}]   # curated coding subset; the full list lives in models.dev

[providers.deepseek]
base_url = "https://api.deepseek.com"
models = [{id="deepseek-v4-pro", context_window=1000000, efforts=["high", "xhigh"]}]   # id, context window, efforts per model (effort values from models.dev)

[providers.local]
base_url = "http://localhost:11434/v1"
model = "qwen3-coder"
models = [{id="qwen3-coder", context_window=32768, efforts=["low", "high", "xhigh"]}]   # local inference, never on models.dev

[permissions]
mode = "default"
deny = ["Read(~/.ssh/**)", "Read(~/.aws/**)"]
