# Dependabot: weekly, one grouped PR per ecosystem for minor and patch
# updates; a major bump gets its own PR because it is a review, not a merge.
# Cargo covers the workspace and the fuzz targets (their own workspace and
# lockfile); npm covers the Hugo site's Tailwind toolchain.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
