# Configuration for pyrlyn/infra's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/infra). Rust CI stays in ci.yml (infra ci-rust.yml + cox-specific jobs); this file
# turns on the scans and SonarCloud, which replaces the former sonarcloud.yml.
version: 1

codeql:
  # Every language in the repository that supports `build-mode: none`.
  languages: [actions, javascript-typescript, python, rust]

sonarcloud:
  enabled: true
  events: [push, pull_request, workflow_dispatch] # as the former sonarcloud.yml
  rust: true # llvm-tools-preview, cargo-llvm-cov
  mise-install-args: rust
  setup-command: bash .github/actions/voice/install.sh # cox-voice build packages
  coverage-command: cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info

# Snyk is switched off (flag; snyk.yml and SNYK_TOKEN stay): the snyk job is skipped and the
# gate counts it as passed. `enabled: true` turns it back on.
snyk:
  enabled: false

# actionlint stays off for now: dist-generated release.yml (never hand-edited) has shellcheck
# findings. Turn on once .github/actionlint.yaml ignores that file.
lint:
  enabled: false
