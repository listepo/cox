name: CI

on:
  pull_request:
    branches: [main]
    # Draft PRs get standard CI: docs-only changes finish in ~2 min and the
    # signal (fmt/clippy/nextest green) is what promotes a draft to ready.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Linux job A (plan.md T4.2): the sandbox must pick bubblewrap.
      - name: bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 confines unprivileged user namespaces behind AppArmor
          # and ships no profile for bwrap, so `bwrap --unshare-user` fails and
          # `sandbox::backend` silently falls back to Landlock — which is what
          # job B tests. Lift the restriction here, then run the exact probe
          # cox runs so a refusal fails this step with bwrap's own message
          # rather than a test three minutes later.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true
          echo "COX_EXPECT_SANDBOX=bwrap" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: test
        run: cargo nextest run --workspace

  # Linux job B (plan.md T4.2): no bwrap on PATH, so the sandbox must fall
  # back to Landlock + seccomp and still hold the same guarantees.
  sandbox-landlock:
    runs-on: ubuntu-24.04
    env:
      COX_EXPECT_SANDBOX: landlock
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: Swatinem/rust-cache@v2

      - name: no bubblewrap
        run: |
          sudo apt-get remove -y bubblewrap || true
          if command -v bwrap; then echo "bwrap still on PATH" && exit 1; fi

      - uses: taiki-e/install-action@nextest

      - name: sandbox tests without bwrap
        run: cargo nextest run -p cox-tools sandbox_ bash_

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # plan.md T30.2: `bash scripts/footprint.sh --check` fails when any metric
  # regresses more than 20% against scripts/footprint.json (keyed by
  # OS-arch plus `-ci`, so each runner compares against a baseline measured on
  # a runner, never against a laptop's; T30.4).
  footprint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: Swatinem/rust-cache@v2

      - name: footprint regression check
        run: bash scripts/footprint.sh --check

  revert-on-failure:
    name: revert-on-failure
    needs: [test, sandbox-landlock, deny, audit, footprint]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          # The GITHUB_TOKEN cannot push workflow files without the
          # `workflows` permission, so a revert of a push that touched
          # .github/ would fail the push. Skip instead (least privilege:
          # no `workflows: write` granted); a human reverts those pushes.
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Base $BEFORE not present locally; skip revert"
            exit 0
          fi
          if git diff --name-only "$BEFORE".."$AFTER" | grep -q '^\.github/'; then
            echo "Push touches .github/; auto-revert cannot push workflow files — skip"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
