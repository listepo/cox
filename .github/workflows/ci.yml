name: CI

on:
  pull_request:
    branches: [main]
    # Draft PRs get standard CI: docs-only changes finish in ~2 min and the
    # signal (fmt/clippy/nextest green) is what promotes a draft to ready.
  workflow_dispatch:
  # Dependabot pull requests: dependabot.yml calls this workflow so they get the
  # same jobs before its patch-only auto-merge.
  workflow_call:

# Build and test jobs need only to read the repository; a job that needs more
# (revert-on-failure) declares its own. This also caps these jobs when
# dependabot.yml calls this workflow with wider permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job installs Rust from mise.toml, the single source of the Rust
# version: the `rust` job through the shared pyrlyn/infra workflow, the others
# through .github/actions/rust. Both fail when rustc is not that pin.
jobs:
  desktop-macos-diag:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: CoxTranscript tests with a watchdog
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
        run: |
          set -uo pipefail
          sw_vers; xcodebuild -version
          swift build --build-tests --build-system swiftbuild --package-path desktop/macos/Packages/CoxTranscript
          (
            sleep 420
            for round in 1 2; do
              echo "=== WATCHDOG round $round"; ps -axo pid,etime,command | grep -Ei "swiftpm|xctest|PackageTests|CoxTranscript" | grep -v grep
              for pid in $(pgrep -f "PackageTests|swiftpm-testing|xctest"); do
                echo "=== sample $pid"; sample "$pid" 3 2>&1 | head -400
              done
              sleep 60
            done
            pkill -f "PackageTests|swiftpm-testing|xctest"
          ) &
          script -q /dev/null swift test --no-parallel --build-system swiftbuild \
            --package-path desktop/macos/Packages/CoxTranscript 2>&1 | cat
          echo "exit ${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
