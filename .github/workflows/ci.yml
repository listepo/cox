name: CI

on:
  pull_request:
    branches: [main]
    # Draft PRs get standard CI: docs-only changes finish in ~2 min and the
    # signal (fmt/clippy/nextest green) is what promotes a draft to ready.
  workflow_dispatch:
  # Dependabot pull requests: dependabot.yml calls this workflow so they get the
  # same jobs before its patch-only auto-merge.
  workflow_call:

# Build and test jobs need only to read the repository; a job that needs more
# (revert-on-failure) declares its own. This also caps these jobs when
# dependabot.yml calls this workflow with wider permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job installs Rust from mise.toml, the single source of the Rust
# version: the `rust` job through the shared listepo/infra workflow, the others
# through .github/actions/rust. Both fail when rustc is not that pin.
jobs:
  # The shared listepo/infra workflow, pinned by commit (descendant of the
  # ci-rust pin in #57; this commit also ships release-plz.yml and pipeline.yml):
  # fmt once, then per target clippy (--all-targets --all-features), check, and
  # nextest where the runner executes the target (Linux x86_64 and aarch64,
  # macOS aarch64) or a build where it does not (macOS x86_64).
  rust:
    uses: listepo/infra/.github/workflows/ci-rust.yml@189816ac5a375e18e0235044970efcbc40e3cabd
    with:
      # The shared matrix minus Windows: the workspace does not build there
      # yet (P57); the `windows` job below checks the crates that do.
      matrix: >-
        [
        {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
        {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
        {"os": "macos-latest", "target": "aarch64-apple-darwin"},
        {"os": "macos-latest", "target": "x86_64-apple-darwin"}
        ]
      # The manifest is virtual with `default-members`; cover every member.
      clippy-args: --workspace
      tools: nextest
      # Linux job A (plan.md T4.2): the sandbox must pick bubblewrap; job B
      # (sandbox-landlock) covers the Landlock fallback. cox-voice's build
      # packages (T54.2) for `--workspace` and `--all-features`.
      setup-command: |
        if [ "$RUNNER_OS" = Linux ]; then bash .github/actions/bwrap/install.sh; fi
        bash .github/actions/voice/install.sh
      test-command: cargo nextest run --workspace
      build-command: cargo build --workspace --all-targets --all-features --target "$TARGET"
      # CI runs only on pull requests, so the default-branch-only cache would
      # never be written.
      cache-all-refs: true

  # Linux job B (plan.md T4.2): no bwrap on PATH, so the sandbox must fall
  # back to Landlock + seccomp and still hold the same guarantees.
  sandbox-landlock:
    runs-on: ubuntu-24.04
    env:
      COX_EXPECT_SANDBOX: landlock
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - name: no bubblewrap
        run: |
          sudo apt-get remove -y bubblewrap || true
          if command -v bwrap; then echo "bwrap still on PATH" && exit 1; fi

      - uses: taiki-e/install-action@nextest

      - name: sandbox tests without bwrap
        run: cargo nextest run -p cox-tools sandbox_ bash_

  # P57 (T57.1): `cargo check` and clippy for x64 and ARM64 Windows over the
  # crates that build there, listed once in the justfile (`windows_crates`);
  # each P57 card adds its crates. Not in revert-on-failure's `needs`: it is
  # required for a merge only once T57.11 builds the whole workspace.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: windows check
        run: just windows-check

  # The guest workspace (plugins/, PL§9, T33.40.2): its own `cargo test`
  # target (a separate workspace, so the root `rust` job above never builds
  # it) plus the wasm32-unknown-unknown build every plugin ships as.
  plugins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # wasm32-unknown-unknown comes with the mise.toml pin.
      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - name: plugin tests
        run: cargo test --manifest-path plugins/Cargo.toml --workspace

      - name: plugin wasm32 build
        run: cargo build --manifest-path plugins/Cargo.toml --workspace --target wasm32-unknown-unknown

  # Guest-language examples that need a toolchain of their own (PL§13):
  # each is `#[ignore]`d in the main `rust` job with a reason naming
  # `just plugin-examples <lang>`, so a missing toolchain here is a CI
  # failure rather than a silently skipped test. Dart (T33.38) today;
  # go/kotlin join this job once T33.34/T33.36 land.
  plugin-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `cox`'s tests build cox-plugin-fixtures, whose build.rs compiles the
      # guest workspace for wasm32 (T33.28); the target comes with the pin.
      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      # The example's `[[mcp]]` server runs under `sandboxed_argv`, which on
      # Linux needs bwrap: Landlock cannot wrap an argv.
      - name: bubblewrap
        uses: ./.github/actions/bwrap

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.4"

      - name: build the Dart example
        run: |
          cd plugins/examples/dart
          dart pub get
          mkdir -p build
          dart compile exe bin/server.dart -o build/example_dart

      - name: dart plugin example e2e
        run: cargo nextest run -p cox --run-ignored only -E 'test(plugin_example_dart)'

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      # cargo-audit does not read deny.toml, so its `[advisories] ignore` list
      # (each entry with its reason and review date) is passed as --ignore
      # flags: one list, one place to remove an entry.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          ignores=$(python3 -c 'import tomllib; print(" ".join("--ignore " + (i if isinstance(i, str) else i["id"]) for i in tomllib.load(open("deny.toml", "rb"))["advisories"]["ignore"]))')
          # shellcheck disable=SC2086 # word splitting into flags is intended
          cargo audit $ignores

  # plan.md T30.2: `bash scripts/footprint.sh --check` fails when any metric
  # regresses more than 20% against scripts/footprint.json (keyed by
  # OS-arch plus `-ci`, so each runner compares against a baseline measured on
  # a runner, never against a laptop's; T30.4).
  footprint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - name: footprint regression check
        run: bash scripts/footprint.sh --check

  # SwiftLint's no-literal rules and swift-format for the macOS app (T37.18,
  # DS§9). The fixtures prove the custom rules still reject what DS§9 bans; the
  # packages are linted by the SwiftLintPlugins build-tool plugin during
  # desktop-macos' `swift test`. SwiftLint is the mise.toml pin.
  desktop-macos-lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: aqua:realm/SwiftLint

      - name: swiftlint fixtures
        working-directory: desktop/macos
        run: |
          set -euo pipefail
          find LintFixtures/Accepted -name '*.swift' -print0 \
            | xargs -0 swiftlint lint --strict --no-cache --quiet
          for fixture in LintFixtures/Rejected/*.swift; do
            rule=$(basename "$fixture" .swift)
            if out=$(swiftlint lint --no-cache --quiet "$fixture"); then
              echo "$fixture: passed, expected $rule to fail it" >&2
              exit 1
            fi
            if ! grep -q "($rule)\$" <<<"$out"; then
              echo "$fixture: failed without a $rule violation:" >&2
              echo "$out" >&2
              exit 1
            fi
          done

      # The app target is in no package, so no build-tool plugin lints it (T37.32.1).
      - name: swiftlint app
        working-directory: desktop/macos
        run: swiftlint lint --strict --no-cache --quiet App

      - name: swift-format
        run: |
          set -euo pipefail
          dirs=(desktop/macos/LintFixtures desktop/macos/App)
          if [ -d desktop/macos/Packages ]; then dirs+=(desktop/macos/Packages); fi
          xcrun swift-format lint --strict --recursive "${dirs[@]}"

  # The macOS app (T37.15, DT§7): CoxFFI.xcframework for Apple Silicon only
  # (A67), then `swift test` for every package under desktop/macos/Packages,
  # then the app target, unsigned (T37.32.1). macos-26 is the arm64 image
  # whose Xcode 26 carries the macOS 26 SDK the app targets.
  desktop-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2

      - name: CoxFFI.xcframework
        run: bash scripts/desktop/xcframework.sh

      - name: arm64 only
        run: |
          set -euo pipefail
          libs=$(find desktop/macos/build/CoxFFI.xcframework -name '*.a')
          [ -n "$libs" ] || { echo "no library in CoxFFI.xcframework" >&2; exit 1; }
          for lib in $libs; do
            archs=$(lipo -archs "$lib")
            echo "$lib: $archs"
            [ "$archs" = arm64 ] || { echo "expected arm64 only" >&2; exit 1; }
          done

      - name: swift test
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in desktop/macos/Packages/*/Package.swift; do
            swift test --package-path "$(dirname "$manifest")"
          done

      # The app target over those packages (T37.32.1): XcodeGen's Cox.xcodeproj, a Debug build
      # with signing off — no identity or secret in this job.
      - name: Cox.app
        run: |
          set -euo pipefail
          mise install aqua:yonaskolb/XcodeGen
          mise exec -- bash scripts/desktop/app.sh CODE_SIGNING_ALLOWED=NO

  # The desktop design tokens (T37.17, DS§2): regenerate Tokens.swift,
  # Colors.xcassets and tokens.css from desktop/design/tokens/*.json and fail
  # on any change, like the config-schema drift test. Node only, so Linux.
  desktop-tokens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node

      - name: regenerate the tokens
        working-directory: desktop/design
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: no drift
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "generated tokens drifted: run \`just desktop-tokens\` and commit" >&2
            exit 1
          fi

  revert-on-failure:
    name: revert-on-failure
    needs:
      [rust, sandbox-landlock, plugins, plugin-examples, deny, audit, footprint]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          # The GITHUB_TOKEN cannot push workflow files without the
          # `workflows` permission, so a revert of a push that touched
          # .github/ would fail the push. Skip instead (least privilege:
          # no `workflows: write` granted); a human reverts those pushes.
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Base $BEFORE not present locally; skip revert"
            exit 0
          fi
          if git diff --name-only "$BEFORE".."$AFTER" | grep -q '^\.github/'; then
            echo "Push touches .github/; auto-revert cannot push workflow files — skip"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
