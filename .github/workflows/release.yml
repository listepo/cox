name: release

# The release build. It never tags: bump.yml (Actions -> Bump and release) is
# the only way to a release. bump runs `scripts/release.sh --local`, opens a pull
# request with the version commit, rebase-merges it once every required check
# is green, tags the commit that landed on main, creates a *draft* release with
# the CHANGELOG.md section for the version, and dispatches this workflow with
# `--ref <tag> -f tag=<tag>`. A tag or release made with GITHUB_TOKEN starts no
# workflow, so the dispatch is explicit.
#
# Here: verify (fmt, clippy, nextest — the same gate as CI) on the tagged
# commit, build all four targets through `scripts/package.sh`, smoke-test the
# native tarballs, upload everything to bump's draft and publish it, then the
# cask. A failed build leaves the tag and a draft (not on /releases/latest, so
# `install.sh` and `cox self update` never see it); re-run this workflow with
# the same tag to finish it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag bump.yml created (vX.Y.Z); run with --ref <tag>'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time; cancelling a run halfway could leave a half-uploaded
# draft behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The cheap job that checks this run is on the tag bump.yml created, before
  # anything is built.
  #
  # The version in `Cargo.toml` *is* the tag: `cox self update` compares the
  # running binary's version against the release tag, so deriving one from the
  # other is what keeps them from disagreeing. It also means "already tagged"
  # is the same statement as "already released".
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is this the tag bump created?
        id: decide
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [ -n "$version" ] || { echo "could not read the version out of Cargo.toml" >&2; exit 1; }
          tag="v$version"
          if [ "$TAG" != "$tag" ]; then
            echo "tag input $TAG is not v<Cargo.toml version> ($tag) at $GITHUB_SHA" >&2
            exit 1
          fi
          # bump.yml tags the commit that landed on main; this run must be on it.
          # Annotated tags peel via ^{commit}; lightweight tags only have the
          # plain refs/tags/<tag> line.
          ref="$(git ls-remote origin "refs/tags/${tag}^{commit}" | awk '{print $1; exit}')"
          if [ -z "$ref" ]; then
            ref="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1; exit}')"
          fi
          [ -n "$ref" ] || { echo "$tag does not exist; release with Bump and release" >&2; exit 1; }
          if [ "$ref" != "$GITHUB_SHA" ]; then
            echo "$tag is $ref, this run is on $GITHUB_SHA; dispatch with --ref $tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "$tag at $ref: releasing it"

  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      # The Rust mise.toml pins, checked like in ci.yml. `cox-plugin-fixtures`
      # builds the example plugin for wasm32 (PL§13, T33.28); the target comes
      # with the pin.
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked

  build:
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            sign: true
          - target: x86_64-apple-darwin
            os: macos-latest
            sign: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            sign: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            sign: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      # The Rust mise.toml pins, checked like in ci.yml; scripts/package.sh
      # adds the matrix target to it.
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2

      # The certificate goes into a keychain of its own, created for this job
      # and deleted at the end of it, so nothing is left on the runner and the
      # login keychain is never touched. An unsigned release is refused the
      # same way an untested one is: it would be discovered by whoever installs
      # it, not here.
      - name: Import signing certificate
        if: matrix.sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
            echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set:" >&2
            echo "a base64-encoded Developer ID Application .p12 and its password." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pwd="$(openssl rand -hex 16)"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$cert"
          # Without this, codesign would prompt for the key and hang the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pwd" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
          if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one Developer ID Application identity, found:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "COX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh ${{ matrix.target }} dist

      - name: Remove signing keychain
        if: always() && matrix.sign && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      # Off until an App Store Connect key exists: setting the repository
      # variable COX_NOTARIZE to `true` turns it on, and from then on a
      # missing secret fails the release, as a missing certificate does.
      - name: Notarise
        if: matrix.sign && vars.COX_NOTARIZE == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "COX_NOTARIZE is on, so APPSTORE_CONNECT_KEY (the .p8 as base64)," >&2
            echo "APPSTORE_CONNECT_KEY_ID and APPSTORE_CONNECT_ISSUER_ID must all be set." >&2
            exit 1
          fi
          work="$RUNNER_TEMP/notarise"
          mkdir -p "$work"
          key="$work/key.p8"
          trap 'rm -f "$key"' EXIT
          echo "$NOTARY_KEY" | base64 --decode > "$key"

          tar -xJf dist/cox-${{ matrix.target }}.tar.xz -C "$work" cox
          ditto -c -k --keepParent "$work/cox" "$work/cox.zip"
          xcrun notarytool submit "$work/cox.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --output-format json > "$work/result.json" || true
          cat "$work/result.json"
          if [ "$(jq -r .status "$work/result.json")" != "Accepted" ]; then
            id="$(jq -r .id "$work/result.json")"
            xcrun notarytool log "$id" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" >&2 || true
            exit 1
          fi

      # The arm64 runner can build the x86_64 slice but cannot run it, so only
      # the native one is smoke-tested here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          mkdir -p smoke
          tar -xJf dist/cox-${{ matrix.target }}.tar.xz -C smoke
          smoke/cox --version
          if [ "${{ matrix.sign }}" = "true" ]; then
            codesign --verify --strict smoke/cox
            codesign --display --verbose=2 smoke/cox 2>&1 \
              | grep -q 'Authority=Developer ID Application'
          fi
          if [ "${{ matrix.sign }}" = "true" ] && [ "${{ vars.COX_NOTARIZE }}" = "true" ]; then
            spctl --assess --type install -vv smoke/cox 2>&1 \
              | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.xz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: staging
      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find staging -name '*.tar.xz' -exec mv {} dist/ \;
          cd dist
          # One aggregate file. Sorted, so the file is reproducible.
          shasum -a 256 $(ls *.tar.xz | sort) > SHA256SUMS
          cat SHA256SUMS
          # Per-archive sidecars: install.sh and `cox self update` fetch
          # `<archive>.sha256` next to each tarball.
          for f in *.tar.xz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      # bump.yml made the tag and the draft release (notes from CHANGELOG.md).
      # Everything goes up to that draft, and publishing it is the last step,
      # so an interrupted run leaves a draft to re-run, never a half release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG: Bump and release creates it" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published \(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'

  # The Homebrew cask in pyrlyn/homebrew-tap is generated from this release:
  # version and both checksums. It runs after publish so `brew install` never
  # names a tarball that is not on the releases page yet.
  tap:
    needs: [version, publish]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # From the published release, not this run's build artifacts: a tap
      # failure can then be re-run without rebuilding (and re-uploading)
      # binaries the tag already describes.
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern 'cox-*-apple-darwin.tar.xz' --dir dist
          ls -l dist
      - name: Generate the cask
        env:
          # A token that can push to pyrlyn/homebrew-tap. The default
          # GITHUB_TOKEN is scoped to this repository, so it cannot.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: pyrlyn/homebrew-tap
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask in $TAP_REPO was not updated" >&2
            exit 1
          fi
          # Checksums come from the published tag; the version advertised in
          # the cask must be that tag's, not HEAD's Cargo.toml if they differ.
          release_tag="$(gh release view "$TAG" --json tagName --jq .tagName)"
          release_version="${release_tag#v}"
          if [ "$release_version" != "$VERSION" ]; then
            echo "cask version $release_version from $TAG does not match workflow version $VERSION" >&2
            exit 1
          fi
          arm="$(shasum -a 256 dist/cox-aarch64-apple-darwin.tar.xz | cut -d' ' -f1)"
          intel="$(shasum -a 256 dist/cox-x86_64-apple-darwin.tar.xz | cut -d' ' -f1)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          scripts/cask.sh "$release_version" "$arm" "$intel" > tap/Casks/cox.rb
      - name: Lint the cask
        run: brew style tap/Casks/cox.rb
      # Commit before smoking: `brew tap … $PWD/tap` uses the git HEAD of a
      # path tap, so an uncommitted Casks/cox.rb would still install the
      # previous release and leave the new checksums untested.
      - name: Commit the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -q -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cox.rb
          if git diff --cached --quiet; then
            echo "cask already at $VERSION"
          else
            git commit -m "cox $VERSION"
          fi
      # brew style only checks syntax; install steps run for real only under
      # `brew install`. Smoke the file about to be pushed so a broken cask
      # never reaches the tap.
      - name: Smoke test the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Homebrew 4.6+ rejects bare cask paths; install via a local tap of the
          # clone we are about to push (pyrlyn/homebrew-tap → pyrlyn/tap).
          # Drop a prior tap first: otherwise `brew tap name path` can leave the
          # remote clone in place and smoke the published cask instead of
          # the one Generate just wrote for this tag.
          brew untap pyrlyn/tap >/dev/null 2>&1 || true
          brew tap pyrlyn/tap "$PWD/tap"
          # Guard: the cask under this tap must advertise the version we published.
          cask_version="$(brew info --cask --json=v2 pyrlyn/tap/cox | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          if [ "$cask_version" != "${{ needs.version.outputs.version }}" ]; then
            echo "smoke would install cask $cask_version, expected ${{ needs.version.outputs.version }}" >&2
            echo "---- tap/Casks/cox.rb ----" >&2
            cat tap/Casks/cox.rb >&2
            exit 1
          fi
          brew install --cask --verbose pyrlyn/tap/cox
          brew uninstall --cask cox
      - name: Push the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          # Commit happened before smoke; push whatever HEAD is (may already
          # match the remote if this tag was re-run).
          if git rev-parse --verify @{u} >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
              echo "cask already at $VERSION on the remote"
              exit 0
            fi
          fi
          git push origin HEAD

  # A failed release opens or comments on a `release-failure` issue that mentions and assigns
  # @listepo (pyrlyn/infra notify-release-failure): GitHub cannot filter Actions notifications
  # per workflow, so this is the release failure notification. Pinned to pyrlyn/infra
  # ci/notify-release-failure; repin to its merge commit.
  notify-failure:
    needs: [version, verify, build, publish, tap]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # failed job names
      issues: write
    steps:
      - uses: pyrlyn/infra/.github/actions/notify-release-failure@d709124d53dd4923eff8f594b3155842508b0049
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}
          needs: ${{ toJSON(needs) }}
