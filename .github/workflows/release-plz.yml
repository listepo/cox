# release-plz (A17, `release-plz.toml`): on every push to main, open or refresh
# the release PR. Nothing here tags anything: only `release-pr` is ever run.
# Tagging is release.yml's job — it publishes the built binaries first and
# only then creates `v<version>` (the ketch model: a tag exists if and only
# if a release completed, so a failed build leaves main untagged rather than
# tagged with nothing behind it).
#
# RELEASE_PLZ_TOKEN is a fine-grained PAT (contents: write, pull requests:
# write) stored as a repository secret. It cannot be the default GITHUB_TOKEN:
# a PR opened with GITHUB_TOKEN never triggers another workflow run, so CI
# would not run on the release PR that merging publishes.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    name: Open or refresh the release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # A workflow run authenticated with the default GITHUB_TOKEN cannot start
      # another workflow run, so the release PR it opens would land on main
      # without CI ever running on it — and merging that PR is what publishes
      # cox. Fail here, loudly, instead.
      - name: A token that can trigger CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.120.0
      # A release PR is written against the last released version, so proposing
      # one while a release is still being published would compare against a
      # tag that does not exist yet and bump from the wrong place. The merge
      # that starts a release therefore opens no PR; the next commit after it
      # does, by which time the tag is there.
      - name: Is a release still being published?
        id: pending
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = \"([^\"]+)\".*/\1/')"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "v$version is not released yet; leaving the release PR alone"
          fi
      - name: Open or update the release pull request
        if: steps.pending.outputs.pending == 'false'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
