# release-plz (A17, `release-plz.toml`): on every push to main, open or refresh
# the release PR through the shared pyrlyn/infra workflow. Nothing here tags
# anything and nothing is dispatched (`release-workflow: ""`): release.yml runs
# on the push itself, publishes the built binaries first and only then creates
# `v<version>`. While that tag is missing (a release in flight) the release PR
# is left alone.
#
# RELEASE_PLZ_TOKEN is a fine-grained PAT (contents: write, pull requests:
# write) stored as an organization secret. It cannot be the default GITHUB_TOKEN:
# a PR opened with GITHUB_TOKEN never triggers another workflow run, so CI
# would not run on the release PR that merging publishes.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    # Pinned to pyrlyn/infra ci/notify-release-failure (a failed run opens a release-failure
    # issue; needs issues: write); repin to its merge commit.
    uses: pyrlyn/infra/.github/workflows/release-plz.yml@0139bdcb95d4e021540743f8fe2c83529a8f676e
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      package: cox
      release-workflow: ""
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
