name: rust from mise.toml
description: >-
  Install the Rust that mise.toml pins (the single source of the Rust version,
  with rustfmt, clippy and the wasm32 target) through jdx/mise-action, make it
  the active toolchain for every later rustup/cargo call, and fail when rustc
  is anything else, e.g. the runner image's own stable. Only `rust` is
  installed; zig and cargo-zigbuild are not needed in CI.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: rust

    - name: rustc is the mise.toml pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(mise current rust)"
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
        export RUSTUP_TOOLCHAIN="$version"
        rustc --version
        rustc --version | grep -q "^rustc $version " \
          || { echo "rustc is not the mise.toml pin $version" >&2; exit 1; }
