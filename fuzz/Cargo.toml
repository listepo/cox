[package]
name = "cox-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cox-protocol = { path = "../crates/cox-protocol" }
cox-core = { path = "../crates/cox-core" }
cox-provider = { path = "../crates/cox-provider" }
cox-tools = { path = "../crates/cox-tools" }
cox-ext = { path = "../crates/cox-ext" }
serde_json = "1.0"

[workspace]

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"

[[bin]]
name = "v4a_parse"
path = "fuzz_targets/v4a_parse.rs"

[[bin]]
name = "frontmatter"
path = "fuzz_targets/frontmatter.rs"

[[bin]]
name = "permission_rules"
path = "fuzz_targets/permission_rules.rs"
