# git-cliff config (T12.3): cox commits are `<task-id>: <title>`, not
# conventional commits, so there are no parsers or groups — every commit
# reachable from HEAD lands in the list verbatim.
[changelog]
header = """
# Changelog

All notable changes to cox, generated by git-cliff from the task commits
(`<task-id>: <title>`). Unreleased until the first `v*` tag lands.
"""
body = """
{% for commit in commits -%}
* {{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = []
filter_commits = false
tag_pattern = "v[0-9]*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
