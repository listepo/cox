name: read-line
prompt: What is line 3 of data.txt? Reply with just that line.
setup: 'printf ''one\ntwo\nthree\nfour\n'' > data.txt

  '
check: 'grep -q three "$COX_OUT"

  '
timeout_s: 120
dry_run:
  turns:
  - text: reading it
    calls:
    - tool: read
      input:
        path: data.txt
        lines: 3-3
    final: three
