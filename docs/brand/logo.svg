  <line x1="32" y1="39" x2="32" y2="50" stroke="#A8E06C" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="25" y2="32" stroke="#A8E06C" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="50" y2="32" stroke="#A8E06C" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="19.3" y1="19.3" x2="27" y2="27" stroke="#7BC85A" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="37" x2="44.7" y2="44.7" stroke="#7BC85A" stroke-width="2" stroke-linecap="round"/>
  <line x1="44.7" y1="19.3" x2="37" y2="27" stroke="#7BC85A" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="37" x2="19.3" y2="44.7" stroke="#7BC85A" stroke-width="2" stroke-linecap="round"/>
