<svg xmlns="http://www.w3.org/2000/svg" width="864" height="942" viewBox="0 0 864 942" font-family="SF Mono, Menlo, DejaVu Sans Mono, Consolas, monospace" font-size="14">
<rect width="100%" height="100%" rx="8" fill="#1e1e1e"/>
<text x="12.0" y="25.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">› what can I press here                                                                             </text>
<text x="12.0" y="43.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">Every key, grouped by context.                                                                      </text>
<text x="12.0" y="61.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">[info] /model [cheap|code|think] [model]                        switch a tier's model               </text>
<text x="12.0" y="79.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /think &lt;prompt&gt;                                          one turn on the think tier, price   </text>
<text x="12.0" y="97.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       confirmed first                                                                              </text>
<text x="12.0" y="115.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /effort [low|high|xhigh]                                 effort for the rest of the session; </text>
<text x="12.0" y="133.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       bare restores the tier default                                                               </text>
<text x="12.0" y="151.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /compact [focus]                                         compact the context now             </text>
<text x="12.0" y="169.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /rewind                                                  go back to an earlier turn: code,   </text>
<text x="12.0" y="187.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       conversation or both                                                                         </text>
<text x="12.0" y="205.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /cost                                                    what this session has spent         </text>
<text x="12.0" y="223.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /context                                                 where the next request's tokens go  </text>
<text x="12.0" y="241.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /autocompact                                             the compaction threshold and its    </text>
<text x="12.0" y="259.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       config source                                                                                </text>
<text x="12.0" y="277.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /permissions [default|plan|auto|bypass]                  show or set the permission mode     </text>
<text x="12.0" y="295.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /sandbox &lt;read-only|workspace-write|danger-full-access&gt;  set the sandbox mode                </text>
<text x="12.0" y="313.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /resume                                                  pick an earlier session to resume   </text>
<text x="12.0" y="331.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /sessions                                                this project's recent sessions      </text>
<text x="12.0" y="349.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /expand &lt;id&gt;                                             show an archived tool output in full</text>
<text x="12.0" y="367.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /agents                                                  live cox sessions in this workspace </text>
<text x="12.0" y="385.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /skills                                                  list skills                         </text>
<text x="12.0" y="403.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /hooks                                                   list hooks                          </text>
<text x="12.0" y="421.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /mcp                                                     MCP servers and their tools         </text>
<text x="12.0" y="439.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /doctor                                                  check the install                   </text>
<text x="12.0" y="457.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /clear                                                   new session, same directory         </text>
<text x="12.0" y="475.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /fork [turn]                                             new child session with the history  </text>
<text x="12.0" y="493.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       up to a turn (default: all)                                                                  </text>
<text x="12.0" y="511.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /handoff &lt;objective&gt;                                     new child session seeded with a     </text>
<text x="12.0" y="529.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       cheap summary and the objective                                                              </text>
<text x="12.0" y="547.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /init [--force]                                          scaffold AGENTS.md for this repo    </text>
<text x="12.0" y="565.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /todo                                                    toggle the todo panel               </text>
<text x="12.0" y="583.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /tasks                                                   list running background tasks       </text>
<text x="12.0" y="601.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /vim                                                     toggle vim keys                     </text>
<text x="12.0" y="619.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /theme [name]                                            pick a colour theme, previewed live </text>
<text x="12.0" y="637.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /help                                                    this list                           </text>
<text x="12.0" y="655.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">       /quit                                                    exit                                </text>
<text x="12.0" y="907.0" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">&gt; </text>
<rect x="28.8" y="894.0" width="8.4" height="18" fill="#666666"/>
<text x="37.2" y="907.0" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#666666">message · @ file · / command</text>
<text x="12.0" y="925.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">sonnet-5 · ctx ▱▱▱▱▱ 0% · $0.00/5 · workspace-write · ⎇ main +12 −3 · [default]                     </text>
<rect x="28.8" y="894.0" width="8.4" height="18" fill="#d4d4d4" fill-opacity="0.5"/>
</svg>
