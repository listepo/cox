<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body class="bg-paper font-sans text-ink antialiased">
    <header class="mx-auto flex h-20 max-w-6xl items-center justify-between px-5 sm:px-7"><a class="font-serif text-[27px] font-bold tracking-[-0.08em]" href="{{ site.Home.RelPermalink }}"><span class="mr-0.5 inline-grid size-[25px] place-items-center rounded-full bg-forest font-serif text-xl leading-none text-white">c</span>ox</a><nav class="flex gap-3 text-xs font-semibold text-muted sm:gap-6 sm:text-sm" aria-label="Primary">{{ range site.Menus.main }}<a class="transition hover:text-forest" href="{{ .URL }}">{{ .Name }}</a>{{ end }}</nav></header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="mx-auto flex max-w-6xl flex-col gap-3 border-t border-line px-5 py-6 text-xs text-muted sm:flex-row sm:justify-between sm:px-7 sm:pb-10"><span>cox is open-source software, built in Rust.</span><a class="font-bold text-forest" href="{{ "/docs" | relURL }}">Read the documentation →</a></footer>
  </body>
</html>
