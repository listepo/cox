{{ define "main" }}
<div class="mx-auto my-8 grid max-w-6xl gap-10 px-5 sm:my-12 sm:grid-cols-[190px_minmax(0,680px)] sm:gap-20 sm:px-7">
  <aside class="border-b border-line pb-4 text-sm sm:border-0">
    <a class="font-semibold text-accent no-underline hover:underline" href="{{ site.Home.RelPermalink }}">← Back to home</a>
    <p class="mb-2 mt-7 font-mono text-[10px] font-semibold tracking-[0.12em] text-muted">DOCUMENTATION</p>
    {{ range where site.RegularPages "Section" "docs" }}
    <a class="mr-4 inline-block py-1.5 text-muted no-underline hover:font-semibold hover:text-accent sm:mr-0 sm:block {{ if eq $.RelPermalink .RelPermalink }}font-semibold !text-accent{{ end }}" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{ end }}
  </aside>
  <article class="doc-content max-w-none">
    <div class="mb-3 font-mono text-[11px] font-semibold uppercase tracking-[0.16em] text-accent">{{ .Section }}</div>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </article>
</div>
{{ end }}
