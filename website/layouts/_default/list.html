{{ define "main" }}
<div class="mx-auto my-8 grid max-w-6xl gap-10 px-5 sm:my-12 sm:grid-cols-[190px_minmax(0,680px)] sm:gap-20 sm:px-7"><aside class="border-b border-line pb-4 text-sm sm:border-0"><a class="font-bold text-forest" href="{{ site.Home.RelPermalink }}">← Back to home</a><p class="mb-2 mt-7 text-[10px] font-extrabold tracking-[0.12em] text-muted">DOCUMENTATION</p>{{ range where site.RegularPages "Section" "docs" }}<a class="mr-4 inline-block py-1.5 text-muted hover:font-bold hover:text-forest sm:mr-0 sm:block" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</aside><article class="doc-content max-w-none"><div class="mb-3 text-[11px] font-extrabold uppercase tracking-[0.16em] text-forest">Documentation</div><h1>{{ .Title }}</h1>{{ .Content }}</article></div>
{{ end }}
