# A background agent call returns a pointer at once; the long child answer
# arrives later as a notice, never as a full tool result. The child and the
# parent continuation race for the next two specs, so the test asserts only
# order-free facts (pointer shape, Created/Completed pair, notice).
[[turn]]
text = "delegating"
tool_calls = [{ name = "agent", input = { task = "dump everything", tools = ["echo"], background = true } }]

# child answer (or the parent continuation, if it wins the race)
[[turn]]
text = "CHILD-ANSWER "

# parent continuation (or the child answer)
[[turn]]
text = "done"
