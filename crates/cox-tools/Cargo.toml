[package]
name = "cox-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.0" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
ignore = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
globset = { workspace = true }
nucleo = { workspace = true }
# T3.2 (`read` mode=outline): AST-based signature extraction for rs/ts/tsx/py/go.
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
# T3.4 (`edit`): unified diffs + closest-line ratio for NotFound suggestions.
similar = { workspace = true }
tree-sitter-bash = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "poll", "term"] }
# T3.8 (`web_fetch`): HTTP client with a hard timeout; shares the workspace rustls pin with cox-provider.
reqwest = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

# T4.2: Linux confinement without bwrap — Landlock for the filesystem,
# seccomp for the network. Linux-only crates, so gated on the target.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }
