[package]
name = "cox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# T37.8 (DT§4.2, §4.3): the UI-agnostic application core the desktop app
# drives — today the timeline fold. Pure over `Event`s: no ratatui, no
# terminal, no CLI (`crates/cox/tests/deps.rs` holds that).

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# The neutral `StyledDoc` half only; the ratatui layout stays in the TUI.
cox-render = { path = "../cox-render", version = "0.1.2", default-features = false }
serde = { workspace = true }
# Tool inputs and `ToolResult.structured` are JSON values (`summary.rs`).
serde_json = { workspace = true }
# T37.9 (DT§4.5): the drain task, its wake-up and the per-frame pull.
tokio = { workspace = true }
# T37.10 (DT§4.2): the workspace reads sessions, search and lock holders
# from cox.db, groups them by git root (cox-config's `find_git_root`), and
# completes `/` from cox-ext's command files and `@` from cox-search's walk.
cox-store = { path = "../cox-store", version = "0.1.2" }
cox-config = { path = "../cox-config", version = "0.1.2" }
cox-ext = { path = "../cox-ext", version = "0.1.2" }
cox-search = { path = "../cox-search", version = "0.1.2" }
thiserror = { workspace = true }

[dev-dependencies]
# The scenario tests run a real session over the Scripted provider and
# reuse cox-core's test harness (`tests/scenarios.rs`).
cox-core = { path = "../cox-core", version = "0.1.2" }
cox-provider = { path = "../cox-provider", version = "0.1.2" }
async-trait = { workspace = true }
insta = { workspace = true }
# Paused time: a consumer that naps 2 s per pull stays a fast test.
tokio = { workspace = true, features = ["test-util"] }
# T37.10: intents run against a scratch COX_HOME; `/fork` goes through
# cox-session's lineage, as the controller will.
cox-session = { path = "../cox-session", version = "0.1.2", default-features = false }
tempfile = { workspace = true }
