# `cox run -p` stream-json: every event in order. Ids, the absolute cwd and
# the usage counters vary per run, so they elide; event order, kinds and the
# final result line are pinned (mirrors `stream_json_lists_every_event_*`).
bin.name = "cox"
args = ["--cwd", "target/trycmd/run_stream_json/work", "run", "-p", "hi", "--output-format", "stream-json"]
status = "success"
stdout = """
{"type":"session_started","session":"[..]","config_digest":"[..]","cwd":"[..]"}
{"type":"turn_started","turn":"[..]","job":"main","tier":"code","model":"claude-sonnet-5"}
{"type":"item_started","item":"[..]","kind":{"type":"user_message","text":"hi","attachments":[]}}
{"type":"item_done","item":"[..]"}
{"type":"item_started","item":"[..]","kind":{"type":"assistant_message","text":""}}
{"type":"text_delta","item":"[..]","text":"hello from scripted"}
{"type":"usage","turn":"[..]","usage":{"input_tokens":[..],"output_tokens":[..],"cache_read_tokens":[..],"cache_write_tokens":[..],"estimated":true,"cost_usd":0.0,"latency_ms":[..]}}
{"type":"item_done","item":"[..]"}
{"type":"assistant","message":{"role":"assistant","content":[{"type":"text","text":"hello from scripted"}]},"session_id":"[..]"}
{"type":"turn_done","turn":"[..]","stop":{"type":"end_turn"}}
{"session":"[..]","result":"hello from scripted","usage":{"input_tokens":[..],"output_tokens":[..],"cache_read_tokens":[..],"cache_write_tokens":[..]},"cost_usd":0.0,"turns":1,"stop":{"type":"end_turn"},"denied":0,"exit_code":0,"type":"result","is_error":false}
"""
stderr = ""

[env.add]
COX_HOME = "target/trycmd/run_stream_json/home"
HOME = "target/trycmd/run_stream_json/home"
COX_PROVIDER = "scripted"
COX_SCENARIO = "../cox-core/tests/scenarios/text_only.toml"

timeout = "120s"
