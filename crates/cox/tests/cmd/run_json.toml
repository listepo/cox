# `--output-format json`: one summary line; the session id and the token
# estimates vary, the rest is the contract a script reads.
bin.name = "cox"
args = ["run", "-p", "hi", "--output-format", "json"]
stdout = """
{"session":"[..]","result":"hello from scripted","usage":{"input_tokens":[..],"output_tokens":[..],"cache_read_tokens":0,"cache_write_tokens":0},"cost_usd":0.0,"turns":1,"stop":{"type":"end_turn"},"denied":0,"exit_code":0}
"""

[env.add]
COX_SCENARIO = "../../../cox-core/tests/scenarios/text_only.toml"

[fs]
cwd = "."
