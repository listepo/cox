# `--output-format stream-json`: session_started first, every event as one
# line, the Claude-compatible `assistant` alias right after the message's
# `item_done`, and the `result` alias right after `turn_done`. Ids and
# token estimates vary; the alias fields stay literal.
bin.name = "cox"
args = ["run", "-p", "hi", "--output-format", "stream-json"]
stdout = """
{"type":"session_started",[..]}
...
{"type":"turn_started",[..]}
...
{"type":"text_delta",[..]}
...
{"type":"assistant","message":{"role":"assistant","content":[{"type":"text","text":"hello from scripted"}]},"session_id":"[..]"}
...
{"type":"turn_done",[..]}
{"session":"[..]","result":"hello from scripted","usage":{"input_tokens":[..],"output_tokens":[..],"cache_read_tokens":0,"cache_write_tokens":0},"cost_usd":0.0,"turns":1,"stop":{"type":"end_turn"},"denied":0,"exit_code":0,"type":"result","is_error":false}
"""

[env.add]
COX_SCENARIO = "../../../cox-core/tests/scenarios/text_only.toml"

[fs]
cwd = "."
