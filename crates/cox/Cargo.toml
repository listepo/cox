[package]
name = "cox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
cox-protocol = { path = "../cox-protocol", version = "0.1.0" }
cox-core = { path = "../cox-core", version = "0.1.0" }
cox-provider = { path = "../cox-provider", version = "0.1.0" }
cox-tools = { path = "../cox-tools", version = "0.1.0" }
cox-mcp = { path = "../cox-mcp", version = "0.1.0" }
cox-store = { path = "../cox-store", version = "0.1.0" }
cox-ext = { path = "../cox-ext", version = "0.1.0" }
cox-tui = { path = "../cox-tui", version = "0.1.0" }
cox-acp = { path = "../cox-acp", version = "0.1.0" }
# T0.3: config loading (figment layers default/user/project/env/flag),
# `cox config set` (toml_edit, preserves comments), anyhow at the cox-crate
# boundary (AGENTS.md: "anyhow only in crates/cox"), serde_json to build
# the CLI-flag override layer and `--json` output.
figment = { workspace = true }
toml_edit = { workspace = true }
anyhow = { workspace = true }
# T0.7: the CLI boundary loads .env/.env.local before parsing flags.
dotenvy = { workspace = true }
serde_json = { workspace = true }
# T0.5: doctor command checks: keyring for API key detection, crossterm for terminal size
keyring = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
# T12.2: `cox self update` downloads releases (reqwest) and verifies their
# sha256 checksums (sha2) before replacing the binary.
reqwest = { workspace = true }
sha2 = { workspace = true }
# T5.8: the binary owns the async runtime the TUI and core loop run on.
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# T6.1: `cox run -p` per output format against the real binary.
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
# T5.8: PTY end-to-end of the real binary (plan D10).
portable-pty = { workspace = true }
vt100 = { workspace = true }
