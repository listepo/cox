[package]
name = "cox-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
async-trait = { workspace = true }
keyring = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# OpenAI-side token counting for T1.8 (no Anthropic-tokenizer equivalent is public).
tiktoken-rs = { workspace = true }
# T1.2: SSE parsing (sse.rs) over a reqwest byte stream.
eventsource-stream = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# T1.7: the price table (`config/prices.toml`) is deserialised with the
# workspace's existing TOML reader rather than a second toml crate.
serde = { workspace = true }
thiserror = { workspace = true }
figment = { workspace = true }
sha2 = { workspace = true }
[build-dependencies]
# T30.12: build.rs generates the Anthropic wire types from the vendored
# OpenAPI spec. schemars 0.8 is the schema model typify 0.8's `TypeSpace`
# takes (already in the tree through typify), not a second schema library.
typify = { workspace = true }
serde_json = { workspace = true }
schemars = "0.8"

[dev-dependencies]
insta = { workspace = true }
wiremock = { workspace = true }
