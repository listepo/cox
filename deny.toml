# cargo-deny config. Run: mise exec -- cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `webpki-roots` ships this permissive license via reqwest/hyper-rustls.
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# T12.4: both are unmaintained transitives of syntect 5.3 (TUI highlighting
# dumps), with no upgrade path inside syntect 5.x and no vulnerability
# attached; re-review when syntect changes. Everything else still fails.
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3 via syntect
    "RUSTSEC-2024-0320", # yaml-rust 0.4.5 via syntect
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
