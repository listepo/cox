# cargo-deny config. Run: mise exec -- cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `webpki-roots` ships this permissive license via reqwest/hyper-rustls.
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # wasmtime and cranelift (under extism, T33.3/A52): Apache-2.0 plus the
    # LLVM exception, which only waives the attribution clause for binaries.
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# T12.4: both are unmaintained transitives of syntect 5.3 (TUI highlighting
# dumps), with no upgrade path inside syntect 5.x and no vulnerability
# attached; re-review when syntect changes. Everything else still fails.
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3 via syntect
    "RUSTSEC-2024-0320", # yaml-rust 0.4.5 via syntect
    # T33.3 (A52): wasmtime 43.0.2 via extism 1.30.0 (research.md R§4.3.5
    # P39). Ignored with a deadline, not forever.
    { id = "RUSTSEC-2026-0222", reason = "wasmtime 43 via extism 1.30.0: not guest-triggerable; needs the embedder to put an object from one Engine into another Engine's Store through specific APIs (debug_register_module, StructRefPre/ArrayRefPre/ExnRefPre::new, Tag::new, breakpoints). Neither extism nor cox calls them, and each extism Plugin keeps its own Engine and Store with no cross-plugin objects. Remove when extism ships wasmtime >= 48 (extism main already pins 48; no release since v1.30.0, 2026-06-04); review by 2026-12-31" },
    { id = "RUSTSEC-2026-0269", reason = "wasmtime 43 via extism 1.30.0: a WASI filesystem sandbox escape through trailing slashes. cox builds every plugin with WASI off and no preopens (cox-plugin host.rs), so no guest has a filesystem to escape; preopens (T33.14) stay blocked until the bump. Remove when extism ships wasmtime >= 48 (extism main already pins 48; no release since v1.30.0, 2026-06-04); review by 2026-12-31" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
